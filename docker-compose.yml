version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: crud_db
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine

  flask_app:
    build: .
    environment:
      DATABASE_URL: postgresql://user:123@db:5432/crud_db
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      - flask_app

volumes:
  pgdata: